name: Build Skate3 aarch64 (RK3326 / M9 Pro)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: aarch64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build aarch64 PortMaster package
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      WGPU_BACKEND: "gl"
      WGPU_SETTINGS_PRIO: "webgl2"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      JOBS: "4"
      PORT_NAME: "skate3"
      MAX_GLIBC: "2.30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64-skate3
          cache-on-failure: true

      - name: Vita-Toolchain-Dateien neutralisieren
        run: |
          set -euo pipefail
          for f in rust-toolchain rust-toolchain.toml; do
            if [ -f "$f" ]; then mv "$f" "$f.disabled-for-aarch64"; fi
          done

      - name: aarch64 Multiarch aktivieren
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sed -i -E 's/^deb (\[[^]]*\] )?http/deb [arch=amd64] http/' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe' \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update

      - name: Build-Pakete installieren
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            git python3 build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu pkg-config curl ca-certificates \
            file patchelf zip unzip imagemagick \
            libasound2-dev:arm64 libudev-dev:arm64 \
            libdrm-dev:arm64 libgbm-dev:arm64 \
            libegl-dev:arm64 libgles2-mesa-dev:arm64
          git --version
          python3 --version

      - name: Prepare .cargo/config.toml
        run: |
          set -euo pipefail
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFGEOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = [
              "-C", "target-cpu=cortex-a35",
              "-C", "target-feature=-outline-atomics",
              "-C", "link-arg=-Wl,--gc-sections",
              "-C", "link-arg=-Wl,--as-needed",
              "-C", "link-arg=-Wl,-O2",
              "-C", "link-arg=-static-libgcc",
              "-C", "panic=abort",
          ]
          [env]
          WGPU_BACKEND = "gl"
          WGPU_SETTINGS_PRIO = "webgl2"
          CFGEOF
          cat .cargo/config.toml
          echo "OK: .cargo/config.toml"

      - name: Prepare fb0_writer.rs
        run: |
          set -euo pipefail
          mkdir -p crates/skate-game/src
          cat > crates/skate-game/src/fb0_writer.rs <<'RSEOF'
          //! /dev/fb0-Writer für RK3326 / M9 Pro.
          use std::fs::{File, OpenOptions};
          use std::io;
          use std::os::unix::io::AsRawFd;
          use std::ptr;
          __BLANK__
          #[repr(C)]
          #[derive(Default)]
          struct FbBitfield {
              offset: u32,
              length: u32,
              msb_right: u32,
          }
          __BLANK__
          #[repr(C)]
          #[derive(Default)]
          struct FbVarScreeninfo {
              xres: u32, yres: u32, xres_virtual: u32, yres_virtual: u32,
              xoffset: u32, yoffset: u32, bits_per_pixel: u32, grayscale: u32,
              red: FbBitfield, green: FbBitfield, blue: FbBitfield, transp: FbBitfield,
              nonstd: u32, activate: u32, height: u32, width: u32, accel_flags: u32,
              pixclock: u32, left_margin: u32, right_margin: u32, upper_margin: u32,
              lower_margin: u32, hsync_len: u32, vsync_len: u32, sync: u32, vmode: u32,
              rotate: u32, colorspace: u32, reserved: [u32; 4],
          }
          __BLANK__
          #[repr(C)]
          #[derive(Default)]
          struct FbFixScreeninfo {
              id: [u8; 16], smem_start: usize, smem_len: u32, type_: u32, type_aux: u32,
              visual: u32, xpanstep: u16, ypanstep: u16, ywrapstep: u16, line_length: u32,
              mmio_start: usize, mmio_len: u32, accel: u32, capabilities: u16, reserved: [u16; 2],
          }
          __BLANK__
          const FBIOGET_VSCREENINFO: u64 = 0x4600;
          const FBIOGET_FSCREENINFO: u64 = 0x4602;
          __BLANK__
          pub struct Fb0Writer {
              file: File,
              var: FbVarScreeninfo,
              fix: FbFixScreeninfo,
              mmap_ptr: *mut u8,
              mmap_len: usize,
          }
          __BLANK__
          unsafe impl Send for Fb0Writer {}
          unsafe impl Sync for Fb0Writer {}
          __BLANK__
          impl Fb0Writer {
              pub fn open() -> io::Result<Self> {
                  let file = OpenOptions::new().read(true).write(true).open("/dev/fb0")?;
                  let fd = file.as_raw_fd();
                  let mut var = FbVarScreeninfo::default();
                  if unsafe { libc::ioctl(fd, FBIOGET_VSCREENINFO, &mut var) } < 0 {
                      return Err(io::Error::last_os_error());
                  }
                  let mut fix = FbFixScreeninfo::default();
                  if unsafe { libc::ioctl(fd, FBIOGET_FSCREENINFO, &mut fix) } < 0 {
                      return Err(io::Error::last_os_error());
                  }
                  let mmap_len = fix.smem_len as usize;
                  let mmap_ptr = unsafe {
                      libc::mmap(ptr::null_mut(), mmap_len,
                          libc::PROT_READ | libc::PROT_WRITE,
                          libc::MAP_SHARED, fd, 0)
                  };
                  if mmap_ptr == libc::MAP_FAILED {
                      return Err(io::Error::last_os_error());
                  }
                  Ok(Self { file, var, fix, mmap_ptr: mmap_ptr as *mut u8, mmap_len })
              }
              pub fn width(&self) -> u32 { self.var.xres }
              pub fn height(&self) -> u32 { self.var.yres }
              pub fn bits_per_pixel(&self) -> u32 { self.var.bits_per_pixel }
          __BLANK__
              pub fn write_rgba8(&mut self, rgba: &[u8], width: u32, height: u32) -> io::Result<()> {
                  if rgba.len() < (width * height * 4) as usize {
                      return Err(io::Error::new(io::ErrorKind::InvalidInput, "RGBA-Puffer zu klein"));
                  }
                  let line_len = self.fix.line_length as usize;
                  match self.var.bits_per_pixel {
                      32 => {
                          for y in 0..height as usize {
                              let src = &rgba[y * width as usize * 4..];
                              let dst = unsafe { self.mmap_ptr.add(y * line_len) as *mut u32 };
                              for x in 0..width as usize {
                                  let r = src[x * 4] as u32;
                                  let g = src[x * 4 + 1] as u32;
                                  let b = src[x * 4 + 2] as u32;
                                  unsafe { *dst.add(x) = (r << 16) | (g << 8) | b; }
                              }
                          }
                      }
                      16 => {
                          for y in 0..height as usize {
                              let src = &rgba[y * width as usize * 4..];
                              let dst = unsafe { self.mmap_ptr.add(y * line_len) as *mut u16 };
                              for x in 0..width as usize {
                                  let r = (src[x * 4] >> 3) as u16;
                                  let g = (src[x * 4 + 1] >> 2) as u16;
                                  let b = (src[x * 4 + 2] >> 3) as u16;
                                  unsafe { *dst.add(x) = (r << 11) | (g << 5) | b; }
                              }
                          }
                      }
                      other => {
                          return Err(io::Error::new(
                              io::ErrorKind::Unsupported,
                              format!("Framebuffer mit {other} bpp wird nicht unterstützt"),
                          ));
                      }
                  }
                  let _ = &self.file;
                  Ok(())
              }
          }
          __BLANK__
          impl Drop for Fb0Writer {
              fn drop(&mut self) {
                  unsafe { libc::munmap(self.mmap_ptr as *mut _, self.mmap_len); }
              }
          }
          RSEOF
          sed -i 's/__BLANK__//g' crates/skate-game/src/fb0_writer.rs
          echo "OK: crates/skate-game/src/fb0_writer.rs"

      - name: Prepare headless_plugin.rs
        run: |
          set -euo pipefail
          cat > crates/skate-game/src/headless_plugin.rs <<'RSEOF'
          //! Headless-Rendering -> /dev/fb0 via Screenshot-API (Bevy 0.18).
          use bevy::prelude::*;
          use bevy::camera::{ImageRenderTarget, RenderTarget};
          use bevy::math::FloatOrd;
          use bevy::render::batching::gpu_preprocessing::NoIndirectDrawing;
          use bevy::render::render_resource::{
              Extent3d, TextureDescriptor, TextureDimension, TextureFormat, TextureUsages,
          };
          use bevy::render::view::RenderLayers;
          use bevy::render::view::window::screenshot::{
              Screenshot, ScreenshotCaptured, ScreenshotPlugin,
          };
          __BLANK__
          use crate::fb0_writer::Fb0Writer;
          __BLANK__
          pub struct HeadlessFbPlugin;
          __BLANK__
          impl Plugin for HeadlessFbPlugin {
              fn build(&self, app: &mut App) {
                  app.add_plugins(ScreenshotPlugin)
                      .add_systems(Startup, setup_offscreen)
                      .add
