name: Build Skate3 aarch64 (RK3326 / M9 Pro)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: aarch64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build aarch64 PortMaster package
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      WGPU_BACKEND: "gl"
      WGPU_SETTINGS_PRIO: "webgl2"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      JOBS: "2"
      PORT_NAME: "skate3"
      MAX_GLIBC: "2.30"
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig"
      PKG_CONFIG_SYSROOT_DIR: "/"
      WGPU_TAG: "v27.0.4"
      WGPU_HAL_VERSION: "27.0.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install curl before toolchain
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl wget ca-certificates
          curl --version

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64-skate3
          cache-on-failure: true

      - name: Vita-Toolchain neutralisieren
        run: |
          set -euo pipefail
          for f in rust-toolchain rust-toolchain.toml; do
            if [ -f "$f" ]; then mv "$f" "$f.disabled-for-aarch64"; fi
          done

      - name: aarch64 Multiarch
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sed -i -E 's/^deb (\[[^]]*\] )?http/deb [arch=amd64] http/' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe' \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update

      - name: Dependencies
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            git python3 python3-pip python3-venv \
            build-essential cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu pkg-config \
            file patchelf zip unzip imagemagick \
            libasound2-dev:arm64 libudev-dev:arm64 \
            libdrm-dev:arm64 libgbm-dev:arm64 \
            libegl-dev:arm64 libgles2-mesa-dev:arm64 \
            libwayland-dev:arm64 libxkbcommon-dev:arm64
          python3 --version
          cmake --version
          pip3 install --no-cache-dir tomlkit
          python3 -c "import tomlkit; print('tomlkit', tomlkit.__version__)"
          git --version
          echo "== Wayland pkg-config =="
          pkg-config --exists wayland-client && echo "wayland-client OK" || echo "wayland-client FEHLT"
          pkg-config --exists xkbcommon && echo "xkbcommon OK" || echo "xkbcommon FEHLT"

      - name: Prepare-Skript vorhanden?
        run: |
          set -euo pipefail
          test -f tools/aarch64-prepare.py || { echo "::error::tools/aarch64-prepare.py fehlt"; exit 1; }
          echo "OK: tools/aarch64-prepare.py"
          python3 -c "import tomlkit" && echo "OK: tomlkit importierbar"

      - name: wgpu ${{ env.WGPU_TAG }} klonen
        run: |
          set -euo pipefail
          rm -rf vendor/wgpu
          git clone --depth 1 --branch "$WGPU_TAG" \
            https://github.com/gfx-rs/wgpu.git vendor/wgpu
          test -f vendor/wgpu/wgpu-hal/src/gles/adapter.rs || { echo "::error::adapter.rs fehlt"; exit 1; }
          test -f vendor/wgpu/Cargo.toml || { echo "::error::wgpu/Cargo.toml fehlt"; exit 1; }
          echo "== Versionen im geklonten Workspace =="
          grep -nE '^version' vendor/wgpu/Cargo.toml | head -5 || true
          grep -nE '^version' vendor/wgpu/wgpu-hal/Cargo.toml | head -5 || true
          echo "OK: wgpu $WGPU_TAG geklont"

      - name: Prepare (alle Patches)
        run: |
          set -euo pipefail
          python3 tools/aarch64-prepare.py

      - name: wgpu-hal-Version verifizieren
        run: |
          set -euo pipefail
          HAL_TOML=vendor/wgpu/wgpu-hal/Cargo.toml
          test -f "$HAL_TOML" || { echo "::error::$HAL_TOML fehlt"; exit 1; }
          ACTUAL=$(grep -E '^version' "$HAL_TOML" | head -1 | sed -E 's/.*"(.*)".*/\1/' || true)
          echo "Erwartet: $WGPU_HAL_VERSION"
          echo "Tatsaechlich: ${ACTUAL:-<nicht gefunden>}"
          if [ "$ACTUAL" != "$WGPU_HAL_VERSION" ]; then
            echo "::error::wgpu-hal hat Version '$ACTUAL', erwartet '$WGPU_HAL_VERSION' — patch.crates-io greift sonst nicht"
            echo "== Erste 30 Zeilen $HAL_TOML =="
            head -30 "$HAL_TOML" || true
            echo "== [workspace.package] in vendor/wgpu/Cargo.toml =="
            sed -n '/^\[workspace.package\]/,/^\[/p' vendor/wgpu/Cargo.toml || true
            exit 1
          fi
          echo "OK: wgpu-hal $WGPU_HAL_VERSION"

      - name: Verifikation nach Prepare
        run: |
          set -euo pipefail
          MISSING=0
          for f in .cargo/config.toml \
                   crates/skate-game/src/fb0_writer.rs \
                   crates/skate-game/src/headless_plugin.rs \
                   portmaster/Skate3.sh portmaster/port.json \
                   portmaster/README.md portmaster/gameinfo.xml; do
            if [ -f "$f" ]; then echo "  OK: $f"; else echo "  FEHLT: $f"; MISSING=1; fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

          echo ""
          echo "== app.rs-Kernpatches =="
          for marker in "primary_window: None" "Backends::GL" "Automatic(WgpuSettings" \
                        "disable::<bevy::winit::WinitPlugin>" "ScheduleRunnerPlugin" \
                        "GpuPreprocessingSupport" "ExitCondition::DontExit"; do
            if grep -q "$marker" crates/skate-game/src/app.rs; then
              echo "  OK: $marker"
            else
              echo "  FEHLT: $marker"
              echo "  -- betroffene Zeilen (WgpuSettings/primary_window/Backends/ExitCondition):"
              grep -nE 'WgpuSettings|primary_window|Backends::|ExitCondition|GpuPreprocessing|ScheduleRunner|WinitPlugin' \
                crates/skate-game/src/app.rs || true
              exit 1
            fi
          done

          echo ""
          echo "== app.rs: Box::new(WgpuSettings darf NICHT vorhanden sein =="
          if grep -q 'Box::new(WgpuSettings' crates/skate-game/src/app.rs; then
            echo "  FEHLER: Box::new(WgpuSettings ist vorhanden (Bevy 0.18 erwartet WgpuSettings ohne Box)"
            grep -n 'Box::new(WgpuSettings' crates/skate-game/src/app.rs || true
            exit 1
          fi
          echo "  OK: kein Box::new(WgpuSettings"

          echo ""
          echo "== app.rs: kein Some(Window ...) mehr =="
          if grep -q 'primary_window: Some' crates/skate-game/src/app.rs; then
            echo "  FEHLER: 'primary_window: Some' ist noch vorhanden"
            grep -n 'primary_window' crates/skate-game/src/app.rs || true
            exit 1
          fi
          echo "  OK"

          echo ""
          echo "== main.rs: exit-Cast =="
          if grep -q 'std::process::exit(code as i32)' crates/skate-game/src/main.rs; then
            echo "  OK: code as i32"
          elif grep -q 'std::process::exit(code)' crates/skate-game/src/main.rs; then
            echo "  WARNUNG: std::process::exit(code) ohne as i32 (Compile-Fehler erwartet)"
          else
            echo "  OK: kein std::process::exit(code) gefunden"
          fi

          echo ""
          echo "== headless_plugin.rs: Bevy-0.18-API =="
          if grep -q 'R36S-Bevy0.18-Option-Data' crates/skate-game/src/headless_plugin.rs; then
            echo "  OK: R36S-Bevy0.18-Option-Data"
          elif grep -q 'MessageReader<ScreenshotCaptured>' crates/skate-game/src/headless_plugin.rs; then
            echo "  FEHLER: MessageReader<ScreenshotCaptured> ist vorhanden, Prepare hat nicht ersetzt"
            grep -n 'MessageReader\|ScreenshotCaptured' crates/skate-game/src/headless_plugin.rs || true
            exit 1
          elif grep -q 'Trigger<ScreenshotCaptured>' crates/skate-game/src/headless_plugin.rs; then
            echo "  FEHLER: Trigger<ScreenshotCaptured> ist vorhanden, Prepare hat nicht ersetzt"
            grep -n 'Trigger\|ScreenshotCaptured' crates/skate-game/src/headless_plugin.rs || true
            exit 1
          elif grep -q 'R36S-Bevy0.18-Fix' crates/skate-game/src/headless_plugin.rs; then
            echo "  FEHLER: alte R36S-Bevy0.18-Fix-Version (ohne Option-Data) – Prepare hat nicht ersetzt"
            grep -n 'write_rgba8\|as_deref\|Option<Vec<u8>>' \
              crates/skate-game/src/headless_plugin.rs || true
            exit 1
          else
            echo "  WARNUNG: unbekannter Screenshot-Mechanismus (kein erwarteter Marker)"
          fi

          echo ""
          echo "== headless_plugin.rs: Image::data Option-Behandlung =="
          if grep -qE 'image\.data\.as_deref' crates/skate-game/src/headless_plugin.rs; then
            echo "  OK: as_deref() auf Image::data"
          else
            echo "  FEHLER: kein as_deref() auf Image::data – E0308 erwartet"
            grep -n 'write_rgba8\|image\.data' crates/skate-game/src/headless_plugin.rs || true
            exit 1
          fi

          echo ""
          echo "== headless_plugin.rs: FbState init_resource =="
          if grep -q 'init_resource::<FbState>' crates/skate-game/src/headless_plugin.rs; then
            echo "  OK: init_resource::<FbState>()"
          else
            echo "  FEHLER: init_resource::<FbState>() fehlt – Runtime-Panic erwartet"
            exit 1
          fi

          echo ""
          echo "== Manuelle-Kleinigkeiten-Patches =="

          if grep -rEq '\.fetch_update\s*\(' crates/ 2>/dev/null; then
            echo "  FEHLER: .fetch_update( noch vorhanden (Prepare hat nicht ersetzt)"
            grep -rEn '\.fetch_update\s*\(' crates/ || true
            exit 1
          fi
          echo "  OK: keine .fetch_update( mehr"

          PLATFORM_FILE=crates/skate-game/src/input/platform.rs
          if [ -f "$PLATFORM_FILE" ]; then
            XINPUT_TOTAL=$(grep -c '\bXinputCaps\b' "$PLATFORM_FILE" 2>/dev/null || true)
            XINPUT_TOTAL=${XINPUT_TOTAL:-0}
            XINPUT_IMPORT=$(grep -cE '^\s*use\s+.*\bXinputCaps\b' "$PLATFORM_FILE" 2>/dev/null || true)
            XINPUT_IMPORT=${XINPUT_IMPORT:-0}
            XINPUT_USES=$((XINPUT_TOTAL - XINPUT_IMPORT))
            echo "  XinputCaps: total=$XINPUT_TOTAL import=$XINPUT_IMPORT uses=$XINPUT_USES"
            if [ "$XINPUT_IMPORT" -gt 0 ] && [ "$XINPUT_USES" -eq 0 ]; then
              echo "  FEHLER: XinputCaps-Import vorhanden, aber nirgends referenziert (unused import)"
              grep -n 'XinputCaps' "$PLATFORM_FILE" || true
              exit 1
            fi
            if [ "$XINPUT_IMPORT" -eq 0 ] && [ "$XINPUT_USES" -gt 0 ]; then
              echo "  WARNUNG: XinputCaps ohne use-Import — falls Nutzung außerhalb Kommentar, Compile-Fehler"
            fi
            echo "  OK: XinputCaps (import=$XINPUT_IMPORT uses=$XINPUT_USES)"
          fi

          echo ""
          echo "== skate-game [lints.rust] dead_code =="
          if grep -q 'dead_code = "allow"' crates/skate-game/Cargo.toml; then
            echo "  OK: dead_code = allow"
          else
            echo "  FEHLT: dead_code = allow in [lints.rust]"
            grep -n 'lints' crates/skate-game/Cargo.toml || true
            exit 1
          fi

          echo ""
          echo "== mimalloc als global_allocator =="
          if grep -q 'mimalloc::MiMalloc' crates/skate-game/src/main.rs; then
            echo "  OK: mimalloc::MiMalloc in main.rs"
          else
            echo "  FEHLER: mimalloc global_allocator fehlt in main.rs"
            grep -n 'global_allocator\|mimalloc' crates/skate-game/src/main.rs || true
            exit 1
          fi
          if grep -q 'mimalloc.workspace = true' crates/skate-game/Cargo.toml; then
            echo "  OK: mimalloc.workspace in skate-game/Cargo.toml"
          else
            echo "  FEHLER: mimalloc.workspace fehlt in skate-game/Cargo.toml"
            grep -n 'mimalloc' crates/skate-game/Cargo.toml || true
            exit 1
          fi
          if grep -q 'mimalloc = "0.1"' Cargo.toml; then
            echo "  OK: mimalloc = \"0.1\" in Root-Cargo.toml"
          else
            echo "  FEHLER: mimalloc fehlt in Root-Cargo.toml [workspace.dependencies]"
            grep -n 'mimalloc' Cargo.toml || true
            exit 1
          fi

          echo ""
          echo "== wgpu-hal naga termcolor =="
          if grep -q 'features = \["termcolor"\]' vendor/wgpu/wgpu-hal/Cargo.toml; then
            echo "  OK: naga termcolor"
          else
            echo "  FEHLT: naga termcolor"
            grep -n 'naga' vendor/wgpu/wgpu-hal/Cargo.toml || true
            exit 1
          fi

          echo ""
          echo "== wgpu-hal SSBO-Patch =="
          if grep -q "Mali-G31 R36S-Fix" vendor/wgpu/wgpu-hal/src/gles/adapter.rs; then
            echo "  OK: Mali-G31 R36S-Fix"
          else
            echo "  FEHLT: Mali-G31 R36S-Fix"
            exit 1
          fi

          echo ""
          echo "== skate-game default-features =="
          if grep -q 'default = \[\]' crates/skate-game/Cargo.toml; then
            echo "  OK: default = []"
          else
            echo "  FEHLT: default = []"
            grep -n 'default' crates/skate-game/Cargo.toml || true
            exit 1
          fi

          echo ""
          echo "== outline-atomics =="
          if grep -qE 'target-feature=.*-outline-atomics' .cargo/config.toml; then
            echo "  OK: -outline-atomics"
          else
            echo "::error::-outline-atomics fehlt in .cargo/config.toml"
            cat .cargo/config.toml || true
            exit 1
          fi

      - name: Memory vor Build (Diagnose)
        run: |
          set -euo pipefail
          free -m
          df -h
          nproc

      - name: Cargo.lock neu auflösen (verhindert doppelte wgpu-Versionen)
        run: |
          set -euo pipefail
          if [ -f Cargo.lock ]; then
            echo "Lösche Cargo.lock, damit [patch.crates-io] für alle wgpu-Crates greift"
            rm -f Cargo.lock
          fi

      - name: Cargo Build
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-unknown-linux-gnu \
            --workspace --jobs "$JOBS" 2>&1 | tee build.log

      - name: Memory nach Build (Diagnose)
        if: always()
        run: |
          set -euo pipefail
          free -m || true

      - name: OOM-Diagnose (nur bei Failure)
        if: failure()
        run: |
          set -euo pipefail
          echo "== dmesg (letzte 40 Zeilen) =="
          dmesg 2>/dev/null | tail -40 || true
          echo "== free =="
          free -m || true
          echo "== letzter build.log-Ausschnitt =="
          tail -50 build.log || true

      - name: glibc pruefen
        run: |
          set -euo pipefail
          BIN=target/aarch64-unknown-linux-gnu/release/skate3rust
          if [ ! -x "$BIN" ]; then echo "::error::$BIN fehlt"; exit 1; fi
          file "$BIN"
          MAX=$(aarch64-linux-gnu-objdump -T "$BIN" \
            | { grep -oE 'GLIBC_[0-9][0-9.]*' || true; } \
            | sed 's/^GLIBC_//' | sort -Vu | tail -1)
          echo "GLIBC: ${MAX:-keine}"
          if [ -n "$MAX" ] && \
             [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$MAX" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::Braucht GLIBC_$MAX, ArkOS hat $MAX_GLIBC"; exit 1
          fi

      - name: PortMaster-Paket vorbereiten
        if: success()
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/dist"
          PORT_DIR="$STAGE/$PORT_NAME"
          BIN="target/aarch64-unknown-linux-gnu/release/skate3rust"
          if [ ! -x "$BIN" ]; then
            echo "::error::Binary $BIN fehlt — Build gescheitert, kein PortMaster-Paket erzeugen"
            exit 1
          fi
          rm -rf "$STAGE"
          mkdir -p "$PORT_DIR/$PORT_NAME/assets"
          install -m 755 "$BIN" "$PORT_DIR/$PORT_NAME/skate3"
          strip --strip-unneeded "$PORT_DIR/$PORT_NAME/skate3" 2>/dev/null || true
          touch "$PORT_DIR/$PORT_NAME/assets/.gitkeep"
          cp portmaster/Skate3.sh portmaster/port.json \
             portmaster/README.md portmaster/gameinfo.xml "$PORT_DIR/"
          chmod 755 "$PORT_DIR/Skate3.sh"
          convert -size 640x480 xc:black -gravity center -fill white \
                  -pointsize 48 -annotate 0 "Skate 3" \
                  "$PORT_DIR/screenshot.jpg" 2>/dev/null || true

      - name: patched-sources Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-sources
          path: |
            .cargo/config.toml
            Cargo.toml
            crates/skate-game/Cargo.toml
            crates/skate-game/src/main.rs
            crates/skate-game/src/app.rs
            crates/skate-game/src/fb0_writer.rs
            crates/skate-game/src/headless_plugin.rs
            crates/skate-game/src/input/platform.rs
            crates/skate-core/src/animation/commands/buffers.rs
            crates/skate-mods/src/vm.rs
            portmaster/
            vendor/wgpu/Cargo.toml
            vendor/wgpu/wgpu-hal/Cargo.toml
            vendor/wgpu/wgpu-core/Cargo.toml
            vendor/wgpu/wgpu-types/Cargo.toml
          if-no-files-found: warn
          include-hidden-files: true

      - name: PortMaster ZIP
        if: success()
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          if [ ! -d "$PORT_NAME" ]; then
            echo "::error::dist/$PORT_NAME fehlt — PortMaster-Paket-Schritt gescheitert"
            exit 1
          fi
          zip -r "skate3.zip" "$PORT_NAME"
          unzip -l skate3.zip || true

      - name: PortMaster Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skate3-portmaster
          path: dist/skate3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build-Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skate3-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
