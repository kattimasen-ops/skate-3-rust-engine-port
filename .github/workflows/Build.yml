name: Build Skate3 aarch64 (RK3326 / M9 Pro)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: aarch64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build aarch64 PortMaster package
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      WGPU_BACKEND: "gl"
      WGPU_SETTINGS_PRIO: "webgl2"
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      JOBS: "4"
      PORT_NAME: "skate3"
      MAX_GLIBC: "2.30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install curl before toolchain
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl wget ca-certificates
          curl --version

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64-skate3
          cache-on-failure: true

      - name: Vita-Toolchain neutralisieren
        run: |
          set -euo pipefail
          for f in rust-toolchain rust-toolchain.toml; do
            if [ -f "$f" ]; then mv "$f" "$f.disabled-for-aarch64"; fi
          done

      - name: aarch64 Multiarch
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64
          cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sed -i -E 's/^deb (\[[^]]*\] )?http/deb [arch=amd64] http/' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe' \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update

      - name: Dependencies
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            git python3 build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu pkg-config \
            file patchelf zip unzip imagemagick \
            libasound2-dev:arm64 libudev-dev:arm64 \
            libdrm-dev:arm64 libgbm-dev:arm64 \
            libegl-dev:arm64 libgles2-mesa-dev:arm64
          python3 --version
          git --version

      - name: Prepare-Skript vorhanden?
        run: |
          set -euo pipefail
          if [ ! -f tools/aarch64-prepare.py ]; then
            echo "::error::tools/aarch64-prepare.py fehlt im Repo"
            exit 1
          fi
          echo "OK: tools/aarch64-prepare.py vorhanden"
          python3 --version

      - name: wgpu v27.0.1 klonen
        run: |
          set -euo pipefail
          rm -rf vendor/wgpu
          git clone --depth 1 --branch v27.0.1 \
            https://github.com/gfx-rs/wgpu.git vendor/wgpu
          test -f vendor/wgpu/wgpu-hal/src/gles/adapter.rs \
            || { echo "::error::wgpu-hal/adapter.rs nicht geklont"; exit 1; }
          test -f vendor/wgpu/Cargo.toml \
            || { echo "::error::wgpu/Cargo.toml nicht geklont"; exit 1; }
          echo "OK: wgpu v27.0.1 geklont"

      - name: Prepare (alle Patches)
        run: |
          set -euo pipefail
          python3 tools/aarch64-prepare.py
          echo ""
          echo "== Verifikation nach Prepare =="
          for f in .cargo/config.toml \
                   crates/skate-game/src/fb0_writer.rs \
                   crates/skate-game/src/headless_plugin.rs \
                   portmaster/Skate3.sh \
                   portmaster/port.json \
                   portmaster/README.md \
                   portmaster/gameinfo.xml; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  FEHLT: $f"
              exit 1
            fi
          done
          echo ""
          echo "== wgpu-hal SSBO-Patch verifiziert =="
          grep -q "Mali-G31 R36S-Fix" vendor/wgpu/wgpu-hal/src/gles/adapter.rs \
            || { echo "::error::SSBO-Patch fehlt"; exit 1; }
          echo "  OK"
          echo ""
          echo "== wgpu workspace.package =="
          grep -A20 '^\[workspace.package\]' vendor/wgpu/Cargo.toml | head -20

      - name: Cargo Build
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-unknown-linux-gnu \
            --workspace --jobs "$JOBS" 2>&1 | tee build.log

      - name: glibc pruefen
        run: |
          set -euo pipefail
          BIN=target/aarch64-unknown-linux-gnu/release/skate3rust
          if [ ! -x "$BIN" ]; then
            echo "::error::$BIN fehlt"
            exit 1
          fi
          file "$BIN"
          MAX=$(aarch64-linux-gnu-objdump -T "$BIN" \
            | { grep -oE 'GLIBC_[0-9][0-9.]*' || true; } \
            | sed 's/^GLIBC_//' | sort -Vu | tail -1)
          echo "Hoechste GLIBC-Version: ${MAX:-keine}"
          if [ -n "$MAX" ] && \
             [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$MAX" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::Braucht GLIBC_$MAX, ArkOS hat nur $MAX_GLIBC"
            exit 1
          fi

      - name: PortMaster-Paket vorbereiten
        if: always()
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/dist"
          PORT_DIR="$STAGE/$PORT_NAME"
          rm -rf "$STAGE"
          mkdir -p "$PORT_DIR/$PORT_NAME/assets"

          BIN="target/aarch64-unknown-linux-gnu/release/skate3rust"
          if [ -x "$BIN" ]; then
            install -m 755 "$BIN" "$PORT_DIR/$PORT_NAME/skate3"
            strip --strip-unneeded "$PORT_DIR/$PORT_NAME/skate3" 2>/dev/null || true
            echo "Binary installiert: $PORT_DIR/$PORT_NAME/skate3"
          else
            echo "::warning::skate3rust-Binary fehlt, Paket ohne Binary"
          fi

          touch "$PORT_DIR/$PORT_NAME/assets/.gitkeep"

          cp portmaster/Skate3.sh    "$PORT_DIR/" 2>/dev/null || true
          cp portmaster/port.json    "$PORT_DIR/" 2>/dev/null || true
          cp portmaster/README.md    "$PORT_DIR/" 2>/dev/null || true
          cp portmaster/gameinfo.xml "$PORT_DIR/" 2>/dev/null || true
          chmod 755 "$PORT_DIR/Skate3.sh" 2>/dev/null || true

          # 640x480 schwarzes JPEG (PortMaster-Anforderung)
          convert -size 640x480 xc:black -gravity center -fill white \
                  -pointsize 48 -annotate 0 "Skate 3" \
                  "$PORT_DIR/screenshot.jpg" 2>/dev/null || \
            convert -size 640x480 xc:black "$PORT_DIR/screenshot.jpg" 2>/dev/null || true

          echo ""
          echo "== dist/ =="
          find "$STAGE" -type f -o -type d | sort

      - name: patched-sources Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-sources
          path: |
            .cargo/config.toml
            Cargo.toml
            crates/skate-game/Cargo.toml
            crates/skate-game/src/main.rs
            crates/skate-game/src/app.rs
            crates/skate-game/src/fb0_writer.rs
            crates/skate-game/src/headless_plugin.rs
            portmaster/
          if-no-files-found: warn

      - name: PortMaster ZIP
        if: always()
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          if [ -d "$PORT_NAME" ]; then
            zip -r "skate3.zip" "$PORT_NAME"
            echo "== ZIP-Inhalt =="
            unzip -l skate3.zip || true
            echo ""
            ls -lah skate3.zip
          else
            echo "::warning::Kein dist/$PORT_NAME – ZIP uebersprungen"
          fi

      - name: PortMaster Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skate3-portmaster
          path: dist/skate3.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Build-Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skate3-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
