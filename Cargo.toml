[workspace]
members = [
    "crates/skate-core",
    "crates/skate-audio",
    "crates/skate-audio-fma",
    "crates/skate-data",
    "crates/skate-game",
    "crates/skate-dynamics",
    "crates/skate-mods",
    "crates/skate-net",
    "crates/skate-steam-relay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# multi_threaded ist standardmäßig in bevy aktiv, aber wir setzen es
# explizit, damit ein späteres `default-features = false` (z.B. für
# schnellere Builds) nicht versehentlich die Parallelisierung abschaltet.
# Das war historisch ein häufiger Fehler in Bevy-Projekten: Task-Pool
# mit N Threads konfiguriert, aber Aufgaben liefen strikt seriell.
bevy = { version = "=0.18.1", features = ["multi_threaded"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

# mimalloc als Global Allocator. glibc malloc fragmentiert auf ARM64
# mit vielen kleinen Allocations (Bevy ECS, Asset-System, wgpu-Buffer)
# stark. mimalloc reduziert den Peak-RAM typischerweise um 30-40 %
# und ist gleichzeitig schneller — beides kritisch auf dem M9 Pro mit
# nur 376 MB verfügbarem RAM.
#
# default-features = true: Die "secure"-Mode-Prüfungen bleiben aktiv.
# Das kostet ~5 % Allocator-Performance, schützt aber vor Puffer-
# Überläufen. Falls später mehr Performance gebraucht wird, kann man
# hier default-features = false setzen und die Sicherheitsprüfungen
# bewusst opfern.
mimalloc = "0.1"

skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }

[profile.dev]
opt-level = 3

# ═════════════════════════════════════════════════════════════════════
# Release: OOM-sicher für 7 GB GitHub-Runner, aber max Performance
# für das, was auf RK3326 tatsächlich zählt.
#
# lto = "thin" statt true (fat):
#   - ~50 % weniger RAM beim Link, ~40 % schneller
#   - ~95 % der Laufzeit-Performance von fat LTO
#   - Wenn später bewiesen ist, dass der Link ohne OOM passt,
#     kann auf lto = true umgestellt werden (+5-10 %)
#
# codegen-units = 4 statt 1:
#   - pro Crate ~4x weniger Peak-RAM in LLVM
#   - cross-unit-Inlining wird durch lto="thin" wieder hereingeholt
#
# package."*" (Dependencies, nicht Workspace-Crates):
#   - opt-level = 2: bevy/wgpu brauchen kein 3, das ist GPU-bound
#   - codegen-units = 16: Standard, schnell, wenig RAM
#
# Workspace-Crates (skate-*) bleiben bei opt-level = 3 für Game-Logik,
# Physik, VM, Decompression.
# ═════════════════════════════════════════════════════════════════════
[profile.release]
debug = 1
strip = false
lto = "thin"
opt-level = 3
codegen-units = 4
panic = "abort"

[profile.release.package."*"]
opt-level = 2
codegen-units = 16

# ═════════════════════════════════════════════════════════════════════
# Ausnahmen: Crates, die trotz "Dependencies"-Regel opt-level = 3
# bekommen, weil sie in jedem Frame laufen und ihr Codegen direkt
# die Laufzeit-Performance bestimmt.
# ═════════════════════════════════════════════════════════════════════

# Der Task-Pool selbst: verteilt Systeme und par_iter auf alle vier
# Cortex-A35-Kerne. Seine inneren Schleifen (Job-Queue, Crossbeam,
# Thread-Wecken) laufen auf jedem Frame mehrfach.
[profile.release.package.bevy_tasks]
opt-level = 3
codegen-units = 16

# mimalloc selbst: Jede Allokation geht durch seinen Code. Auf einem
# 4-Kern-Cortex-A35 mit hoher Allocation-Rate (Assets, Buffer-Uploads,
# Frame-Logik) macht opt-level = 3 einen messbaren Unterschied bei
# der Allocator-Latenz. mimalloc ist klein, das kostet kaum Compile-RAM.
[profile.release.package.mimalloc]
opt-level = 3
codegen-units = 1

# ═════════════════════════════════════════════════════════════════════
# Optional: Performance-Booster für Hot Math/Physics Crates.
# ═════════════════════════════════════════════════════════════════════
#
# AKTIVIEREN ERST NACH:
#   1. Erfolgreichem Build (Binary vorhanden)
#   2. Erstem Runtime-Test auf M9 Pro
#   3. Profiling zeigt: Physik/Math ist der Flaschenhals (nicht GPU)
#
# WARNUNG: Diese Overrides erhöhen Peak-RAM beim Kompilieren. Auf einem
# 7-GB-Runner kann das zusammen mit codegen-units=4 zu OOM führen.
# Fallback wenn OOM: JOBS: "1" in .github/workflows/Build.yml.
#
# Erwarteter Gewinn auf Cortex-A35: 3-8 % in Szenen mit vielen Objekten
# (Physik, Skinning, Animation), 0 % in GPU-limitierten Szenen.
#
# Zum Aktivieren die führenden "# " entfernen.
#
# [profile.release.package.glam]
# opt-level = 3
#
# [profile.release.package.nalgebra]
# opt-level = 3
#
# [profile.release.package.parry3d]
# opt-level = 3
#
# [profile.release.package.rapier3d]
# opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
sdl3-sys = { path = "vendor/sdl3-sys" }
# Wird vom Workflow aktiviert, sobald vendor/wgpu existiert:
# wgpu-hal = { path = "vendor/wgpu/wgpu-hal" }
