[workspace]
members = [
    "crates/skate-core",
    "crates/skate-audio",
    "crates/skate-audio-fma",
    "crates/skate-data",
    "crates/skate-game",
    "crates/skate-dynamics",
    "crates/skate-mods",
    "crates/skate-net",
    "crates/skate-steam-relay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "=0.18.1", features = ["multi_threaded"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
mimalloc = "0.1"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
strip = false
lto = "thin"
opt-level = 3
codegen-units = 4
panic = "abort"

[profile.release.package."*"]
opt-level = 2
codegen-units = 16

[profile.release.package.bevy_tasks]
opt-level = 3
codegen-units = 16

[profile.release.package.mimalloc]
opt-level = 3
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
sdl3-sys = { path = "vendor/sdl3-sys" }
