[workspace]
members = [
    "crates/skate-core",
    "crates/skate-audio",
    "crates/skate-audio-fma",
    "crates/skate-data",
    "crates/skate-game",
    "crates/skate-dynamics",
    "crates/skate-mods",
    "crates/skate-net",
    "crates/skate-steam-relay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "=0.18.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }

[profile.dev]
opt-level = 3

# ═════════════════════════════════════════════════════════════════════
# Release: OOM-sicher für 7 GB GitHub-Runner, aber max Performance
# für das, was auf RK3326 tatsächlich zählt.
#
# lto = "thin" statt true (fat):
#   - ~50 % weniger RAM beim Link, ~40 % schneller
#   - ~95 % der Laufzeit-Performance von fat LTO
#   - Wenn später bewiesen ist, dass der Link ohne OOM passt,
#     kann auf lto = true umgestellt werden (+5–10 %)
#
# codegen-units = 4 statt 1:
#   - pro Crate ~4x weniger Peak-RAM in LLVM
#   - cross-unit-Inlining wird durch lto="thin" wieder hereingeholt
#
# package."*" (Dependencies, nicht Workspace-Crates):
#   - opt-level = 2: bevy/wgpu brauchen kein 3, das ist GPU-bound
#   - codegen-units = 16: Standard, schnell, wenig RAM
#
# Workspace-Crates (skate-*) bleiben bei opt-level = 3 für Game-Logik,
# Physik, VM, Decompression.
# ═════════════════════════════════════════════════════════════════════
[profile.release]
debug = 1
strip = false
lto = "thin"
opt-level = 3
codegen-units = 4
panic = "abort"

[profile.release.package."*"]
opt-level = 2
codegen-units = 16

# ═════════════════════════════════════════════════════════════════════
# Optional: Performance-Booster für Hot Math/Physics Crates.
# ═════════════════════════════════════════════════════════════════════
#
# AKTIVIEREN ERST NACH:
#   1. Erfolgreichem Build (Binary vorhanden)
#   2. Erstem Runtime-Test auf M9 Pro
#   3. Profiling zeigt: Physik/Math ist der Flaschenhals (nicht GPU)
#
# WARNUNG: Diese Overrides erhöhen Peak-RAM beim Kompilieren. Auf einem
# 7-GB-Runner kann das zusammen mit codegen-units=4 zu OOM führen.
# Fallback wenn OOM: JOBS: "1" in .github/workflows/Build.yml.
#
# Erwarteter Gewinn auf Cortex-A35: 3–8 % in Szenen mit vielen Objekten
# (Physik, Skinning, Animation), 0 % in GPU-limitierten Szenen.
#
# Zum Aktivieren die führenden "# " entfernen.
#
# [profile.release.package.glam]
# opt-level = 3
#
# [profile.release.package.nalgebra]
# opt-level = 3
#
# [profile.release.package.parry3d]
# opt-level = 3
#
# [profile.release.package.rapier3d]
# opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
sdl3-sys = { path = "vendor/sdl3-sys" }
# Wird vom Workflow aktiviert, sobald vendor/wgpu existiert:
# wgpu-hal = { path = "vendor/wgpu/wgpu-hal" }
